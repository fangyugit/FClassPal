name: build-multiplatform

# 多平台产物构建（本机是 Windows，出不了 macOS 包；这条流水线补上）。
#   - 手动触发（Actions 页签 Run workflow）
#   - 或推送 v* 标签时自动跑，并把产物直接挂到对应 Release 上
#     · 仅当 tag 等于当前 package.json 版本时才跑；历史存档 tag 一律跳过（见 gate 任务）
# 产物：
#   macOS   FClassPal-<version>-mac-{x64,arm64}.dmg / .zip（未签名，首次打开需右键->打开）
#   Android FClassPal-<version>-android-debug.apk（debug 签名，装上就能用）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 往 Release 传附件需要

jobs:
  # 版本闸门：tag 必须与当前 package.json 版本一致，才算「本轮正式发布」。
  # 历史存档 tag（v1.5.0 / v2.0.0 …）同样命中 v* 触发器，但它们 checkout 到的
  # 是当前 main —— 于是会把 2.5.0 的安装包挂到 v1.5.0 的存档页上。这里先把
  # 这种 tag 挡在构建之前。
  gate:
    name: 版本闸门
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" = "v${PKG}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本一致，正常构建"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "tag ${GITHUB_REF_NAME} != v${PKG}（历史存档 tag），跳过构建与上传"
          fi

  macos:
    name: macOS (x64 + arm64)
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.current == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build macOS (dmg + zip, x64 & arm64)
        env:
          # 不签名：没有开发者证书，产物保持未签名状态
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # --publish never：tag 构建时 electron-builder 默认会自己往 GitHub 发
          # （要 GH_TOKEN，没有就整个 job 报错退出——产物其实早就 build 完了）；
          # 发布统一交给后面的 gh release upload，这里只管产出文件
          PUBLISH: never
        run: npx electron-builder --mac --x64 --arm64 --publish never
      - name: Collect artifacts
        run: |
          mkdir -p _out
          cp dist/FClassPal-*mac-*.dmg dist/FClassPal-*mac-*.zip _out/ 2>/dev/null || true
          ls -la _out
      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: _out/*
      - name: Upload to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" _out/* --repo "$GITHUB_REPOSITORY" --clobber

  android:
    name: Android (debug apk)
    needs: gate
    if: github.event_name == 'workflow_dispatch' || needs.gate.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21   # Capacitor 8 的 compileOptions 要求 Java 21
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Install dependencies
        run: |
          cd mobile
          npm install --no-audit --no-fund
      - name: Assemble web assets + apply native overlay
        run: |
          cd mobile
          node tools/assemble-web.js
          npx cap add android
          node tools/apply-android-overlay.js
      - name: Build debug APK
        run: node mobile/tools/build-apk.js debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/FClassPal-*-android-debug.apk
      - name: Upload to release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/FClassPal-*-android-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
